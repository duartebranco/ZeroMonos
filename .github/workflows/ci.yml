name: ZeroMonos CI with SonarCloud

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

jobs:
    build:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:15
                ports:
                    - 5432:5432
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: zeromonosdb
                options: >-
                    --health-cmd="pg_isready -U postgres"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  distribution: "temurin"
                  java-version: "21"
                  cache: "maven"

            - name: Wait for PostgreSQL
              run: |
                  for i in {1..10}; do
                    nc -z localhost 5432 && echo "Postgres is up!" && break
                    echo "Waiting for Postgres..."
                    sleep 5
                  done

            - name: Build, Test and Analyze with SonarCloud
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
              run: |
                  mvn -B clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
                    -Dsonar.projectKey=duartebranco_ZeroMonos \
                    -Dsonar.organization=duartebranco \
                    -Dsonar.host.url=https://sonarcloud.io \
                    -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
                    -Dspring.datasource.url=jdbc:postgresql://localhost:5432/zeromonosdb \
                    -Dspring.datasource.username=postgres \
                    -Dspring.datasource.password=postgres

            - name: Wait for SonarCloud Quality Gate
              uses: sonarsource/sonarqube-quality-gate-action@master
              timeout-minutes: 10
              with:
                  scanMetadataReportFile: target/sonar/report-task.txt
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
