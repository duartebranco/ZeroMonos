spring.application.name=hw1

# PostgreSQL configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/zeromonosdb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
# create-drop: recreates schema on each restart (good for development)
# update: preserves data but updates schema (good when you want to keep data)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server settings
server.port=8081

# Logging configuration
logging.level.ua.deti.tqs.hw1=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# Log to file
logging.file.name=logs/zeromonos.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
