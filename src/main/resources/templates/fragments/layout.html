<!doctype html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
    <head th:fragment="head(title)">
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title th:text="${title}">ZeroMonos</title>

        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
            rel="stylesheet"
        />

        <link
            rel="icon"
            href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2211%22 font-size=%2212%22>♻️</text></svg>"
        />

        <link rel="stylesheet" th:href="@{/css/style.css}" />
    </head>

    <body>
        <!-- Header / Navbar fragment -->
        <header th:fragment="header">
            <div class="topbar" role="banner">
                <div class="topbar-inner">
                    <a th:if="${citizenOnlyNav}" th:href="@{/}" class="brand">
                        <div class="logo" aria-hidden="true">♻️</div>
                        <div>
                            <div style="font-size: 0.95rem">ZeroMonos</div>
                            <div style="font-size: 0.75rem; opacity: 0.9">
                                Citizen Portal
                            </div>
                        </div>
                    </a>
                    <a
                        th:unless="${citizenOnlyNav}"
                        th:href="@{/}"
                        class="brand"
                    >
                        <div class="logo" aria-hidden="true">♻️</div>
                        <div>
                            <div style="font-size: 0.95rem">ZeroMonos</div>
                            <div style="font-size: 0.75rem; opacity: 0.9">
                                Staff Portal
                            </div>
                        </div>
                    </a>

                    <nav
                        class="nav"
                        role="navigation"
                        aria-label="Main navigation"
                    >
                        <div th:if="${citizenOnlyNav}">
                            <a
                                th:href="@{/citizen/reserve}"
                                title="Book Collection"
                                >Book</a
                            >
                            <a
                                th:href="@{/citizen/check}"
                                title="Check Appointment"
                                >Check</a
                            >
                        </div>
                    </nav>
                </div>
            </div>
        </header>

        <!-- Reusable content wrapper -->
        <div th:fragment="content">
            <div class="page">
                <div class="card">
                    <h1 th:text="${title}">ZeroMonos</h1>
                    <div th:insert="~{::section}"></div>
                </div>
            </div>
        </div>

        <!-- Footer fragment -->
        <footer class="site-footer" th:fragment="footer">
            <div>
                <small
                    >©
                    <span th:text="${T(java.time.Year).now()}">2025</span>
                    ZeroMonos — TQS Project</small
                >
            </div>
        </footer>

        <!-- Scripts fragment: easy to replace/extend per-page -->
        <div th:fragment="scripts">
            <script th:src="@{/js/layout.js}"></script>
        </div>
    </body>
</html>
